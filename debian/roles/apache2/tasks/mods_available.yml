---
- name: Create /etc/apache2/mods-available
  ansible.builtin.file:
    path: /etc/apache2/mods-available
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create apache2 module configuration files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/etc/apache2/mods-available/{{ item.key }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ apache2_mods_available | dict2items }}"
  notify:
    - Restart apache2
