---
- name: Create /etc/nginx/sites-enabled
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Define variable
  ansible.builtin.set_fact:
    _nginx_sites_enabled: {}

- name: Define symlinks to nginx configuration snippets
  ansible.builtin.set_fact:
    _nginx_sites_enabled: "{{ _nginx_sites_enabled | combine({ '/etc/nginx/sites-enabled/' ~ item: '../sites-available/' ~ item }) }}"
  loop: "{{ nginx_sites_enabled }}"

- name: Find existing symlinks to nginx configuration snippets
  ansible.builtin.find:
    paths: /etc/nginx/sites-enabled
    file_type: link
  register: symlinks

- name: Remove unwanted symlinks to nginx configuration snippets
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  when: item.path not in _nginx_sites_enabled
  loop: "{{ symlinks.files }}"
  notify:
    - Restart nginx
  
- name: Find files in /etc/nginx/sites-enabled
  ansible.builtin.find:
    paths: /etc/nginx/sites-enabled
  register: files

- name: Remove files from /etc/nginx/sites-enabled
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ files.files }}"
  notify:
    - Restart nginx
  
- name: Create symlinks to nginx configuration snippets
  ansible.builtin.file:
    src: "{{ item.value }}"
    dest: "{{ item.key }}"
    state: link
  loop: "{{ _nginx_sites_enabled | dict2items }}"
  notify:
    - Restart nginx
